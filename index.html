<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Görev Listesi</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #8a8f98;
      --accent: #4f6bed;
      --danger: #d64545;
      --border: #e3e5e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e6e8eb;
        --muted: #8a8f98;
        --border: #2e3238;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button.add {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.add:hover { opacity: 0.9; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    button.delete {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
    }
    button.delete:hover { color: var(--danger); background: rgba(214, 69, 69, 0.1); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    select {
      padding: 10px 8px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    select option { color: #1f2328; }
    li { border-left: 4px solid transparent; padding-left: 10px; }
    li.p-dusuk { border-left-color: #3fa65b; }
    li.p-orta { border-left-color: #e0a526; }
    li.p-yuksek { border-left-color: #d64545; }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
    }
    .p-dusuk .badge { background: #3fa65b; }
    .p-orta .badge { background: #e0a526; }
    .p-yuksek .badge { background: #d64545; }
    li.done .badge { opacity: 0.5; }
    details.folder { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 12px; }
    details.folder summary { cursor: pointer; color: var(--muted); font-size: 0.95rem; }
    .folder-note { color: var(--muted); font-size: 0.8rem; margin: 8px 0 0; }
    .expiry { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Görev Listesi</h1>
    <p class="count" id="count"></p>

    <form id="form">
      <input type="text" id="input" placeholder="Yeni görev ekle..." autocomplete="off" required>
      <select id="priority" aria-label="Önem derecesi">
        <option value="dusuk">Düşük</option>
        <option value="orta" selected>Orta</option>
        <option value="yuksek">Yüksek</option>
      </select>
      <button type="submit" class="add">Ekle</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">Henüz görev yok.</p>

    <details class="folder" id="folder" hidden>
      <summary id="folderTitle"></summary>
      <p class="folder-note">Tamamlanan görevler burada 30 gün saklanır, sonra otomatik silinir.</p>
      <ul id="doneList"></ul>
    </details>
  </main>

  <script>
    const STORAGE_KEY = 'todos';
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const prioritySelect = document.getElementById('priority');
    const doneList = document.getElementById('doneList');
    const folder = document.getElementById('folder');
    const folderTitle = document.getElementById('folderTitle');
    const LABELS = { dusuk: 'Düşük', orta: 'Orta', yuksek: 'Yüksek' };
    const RETENTION_MS = 30 * 24 * 60 * 60 * 1000;

    let todos = load();

    // Tamamlanma tarihi olmayan eski görevlere şimdiyi ata, 30 günü geçenleri sil.
    function purgeExpired() {
      const now = Date.now();
      let changed = false;
      for (const t of todos) {
        if (t.done && !t.doneAt) { t.doneAt = now; changed = true; }
      }
      const kept = todos.filter(t => !(t.done && now - t.doneAt > RETENTION_MS));
      if (kept.length !== todos.length) { todos = kept; changed = true; }
      if (changed) save();
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch {}
    }

    function render() {
      purgeExpired();
      list.innerHTML = '';
      doneList.innerHTML = '';
      const ORDER = { yuksek: 0, orta: 1, dusuk: 2 };
      const rank = t => ORDER[t.priority] ?? ORDER.orta;
      const sorted = [...todos].sort((a, b) => rank(a) - rank(b));
      for (const todo of sorted) {
        const li = document.createElement('li');
        const prio = LABELS[todo.priority] ? todo.priority : 'orta';
        li.classList.add('p-' + prio);
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', 'Tamamlandı olarak işaretle');
        checkbox.addEventListener('change', () => toggle(todo.id));

        const text = document.createElement('span');
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = '×';
        del.title = 'Sil';
        del.setAttribute('aria-label', 'Görevi sil');
        del.addEventListener('click', () => remove(todo.id));

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = LABELS[prio];

        li.append(checkbox, text);
        if (todo.done) {
          const daysLeft = Math.max(0, Math.ceil((todo.doneAt + RETENTION_MS - Date.now()) / 86400000));
          const expiry = document.createElement('span');
          expiry.className = 'expiry';
          expiry.textContent = `${daysLeft} gün kaldı`;
          li.append(expiry);
        }
        li.append(badge, del);
        (todo.done ? doneList : list).appendChild(li);
      }

      const doneCount = todos.filter(t => t.done).length;
      const remaining = todos.length - doneCount;
      empty.style.display = remaining ? 'none' : 'block';
      empty.textContent = todos.length ? 'Bekleyen görev yok.' : 'Henüz görev yok.';
      count.textContent = todos.length
        ? `${todos.length} görev · ${remaining} kalan`
        : '';
      folder.hidden = doneCount === 0;
      folderTitle.textContent = `Tamamlananlar (${doneCount})`;
    }

    function add(text, priority) {
      const id = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      todos.push({ id, text, done: false, priority });
      save();
      render();
    }

    function toggle(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        todo.doneAt = todo.done ? Date.now() : null;
      }
      save();
      render();
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, prioritySelect.value);
      input.value = '';
      input.focus();
    });

    render();
  </script>
</body>
</html>
