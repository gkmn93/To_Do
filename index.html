<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Görev Listesi</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #8a8f98;
      --accent: #4f6bed;
      --danger: #d64545;
      --border: #e3e5e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e6e8eb;
        --muted: #8a8f98;
        --border: #2e3238;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button.add {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.add:hover { opacity: 0.9; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    button.delete {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
    }
    button.delete:hover { color: var(--danger); background: rgba(214, 69, 69, 0.1); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    select {
      padding: 10px 8px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    select option { color: #1f2328; }
    li { border-left: 4px solid transparent; padding-left: 10px; }
    li.p-dusuk { border-left-color: #3fa65b; }
    li.p-orta { border-left-color: #e0a526; }
    li.p-yuksek { border-left-color: #d64545; }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
    }
    .p-dusuk .badge { background: #3fa65b; }
    .p-orta .badge { background: #e0a526; }
    .p-yuksek .badge { background: #d64545; }
    li.done .badge { opacity: 0.5; }
    details.folder { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 12px; }
    details.folder summary { cursor: pointer; color: var(--muted); font-size: 0.95rem; }
    .folder-note { color: var(--muted); font-size: 0.8rem; margin: 8px 0 0; }
    .expiry { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
    button.edit, button.save, button.cancel {
      border: none;
      background: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
    }
    button.edit:hover, button.save:hover { color: var(--accent); background: rgba(79, 107, 237, 0.1); }
    button.cancel:hover { color: var(--danger); background: rgba(214, 69, 69, 0.1); }
    li input.edit-text { padding: 6px 8px; font-size: 0.95rem; min-width: 0; }
    li select { padding: 6px 4px; }
    li span.badge, li span.expiry { flex: none; }
    input[type="datetime-local"] {
      padding: 10px 12px;
      font-size: 1rem;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    form { flex-wrap: wrap; }
    form input[type="text"] { flex: 1 1 100%; }
    form input[type="datetime-local"] { flex: 2 1 170px; }
    form select { flex: 1 1 90px; }
    form button.add { flex: 1 1 80px; }
    li input[type="datetime-local"] { padding: 6px 8px; font-size: 0.9rem; flex: 1 1 160px; }
    .due { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
    li.overdue .due { color: var(--danger); font-weight: 600; }
    button.cal {
      border: none;
      background: none;
      font-size: 1.05rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }
    button.cal:hover { background: rgba(79, 107, 237, 0.1); }
    #toasts {
      position: fixed;
      top: 12px; left: 12px; right: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none;
      z-index: 10;
    }
    .toast {
      pointer-events: auto;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      width: 100%; max-width: 480px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .toast button { border: none; background: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
    form input[type="text"] { min-width: 0; }
    select { font-size: 1rem; }
    @media (max-width: 480px) {
      body { padding: 24px 12px; }
      .app { padding: 16px; }
      form { flex-wrap: wrap; }
      form input[type="text"] { flex: 1 1 100%; }
      form select, form button.add { flex: 1; }
      li { gap: 6px; }
      li:has(input.edit-text) { flex-wrap: wrap; }
      li input.edit-text { flex: 1 1 60%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Görev Listesi</h1>
    <p class="count" id="count"></p>

    <form id="form">
      <input type="text" id="input" placeholder="Yeni görev ekle..." autocomplete="off" required>
      <input type="datetime-local" id="due" aria-label="Hatırlatma zamanı" title="Hatırlatma zamanı (isteğe bağlı)">
      <select id="priority" aria-label="Önem derecesi">
        <option value="dusuk">Düşük</option>
        <option value="orta" selected>Orta</option>
        <option value="yuksek">Yüksek</option>
      </select>
      <button type="submit" class="add">Ekle</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">Henüz görev yok.</p>

    <details class="folder" id="folder" hidden>
      <summary id="folderTitle"></summary>
      <p class="folder-note">Tamamlanan görevler burada 30 gün saklanır, sonra otomatik silinir.</p>
      <ul id="doneList"></ul>
    </details>
  </main>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = 'todos';
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const prioritySelect = document.getElementById('priority');
    const dueInput = document.getElementById('due');
    const toasts = document.getElementById('toasts');
    const doneList = document.getElementById('doneList');
    const folder = document.getElementById('folder');
    const folderTitle = document.getElementById('folderTitle');
    const LABELS = { dusuk: 'Düşük', orta: 'Orta', yuksek: 'Yüksek' };
    const RETENTION_MS = 30 * 24 * 60 * 60 * 1000;
    let editingId = null;

    let todos = load();

    // Tamamlanma tarihi olmayan eski görevlere şimdiyi ata, 30 günü geçenleri sil.
    function purgeExpired() {
      const now = Date.now();
      let changed = false;
      for (const t of todos) {
        if (t.done && !t.doneAt) { t.doneAt = now; changed = true; }
      }
      const kept = todos.filter(t => !(t.done && now - t.doneAt > RETENTION_MS));
      if (kept.length !== todos.length) { todos = kept; changed = true; }
      if (changed) save();
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); } catch {}
    }

    function render() {
      purgeExpired();
      list.innerHTML = '';
      doneList.innerHTML = '';
      const ORDER = { yuksek: 0, orta: 1, dusuk: 2 };
      const rank = t => ORDER[t.priority] ?? ORDER.orta;
      const sorted = [...todos].sort((a, b) => rank(a) - rank(b));
      for (const todo of sorted) {
        const li = document.createElement('li');
        const prio = LABELS[todo.priority] ? todo.priority : 'orta';
        li.classList.add('p-' + prio);
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', 'Tamamlandı olarak işaretle');
        checkbox.addEventListener('change', () => toggle(todo.id));

        const text = document.createElement('span');
        text.textContent = todo.text;
        if (todo.due) {
          const when = new Date(todo.due);
          const dueEl = document.createElement('small');
          dueEl.className = 'due';
          dueEl.textContent = '⏰ ' + formatDue(when);
          text.appendChild(dueEl);
          if (!todo.done && when.getTime() <= Date.now()) li.classList.add('overdue');
        }

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = '×';
        del.title = 'Sil';
        del.setAttribute('aria-label', 'Görevi sil');
        del.addEventListener('click', () => remove(todo.id));

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = LABELS[prio];

        if (todo.id === editingId) {
          buildEditRow(li, todo, checkbox);
          (todo.done ? doneList : list).appendChild(li);
          continue;
        }

        li.append(checkbox, text);
        if (todo.done) {
          const daysLeft = Math.max(0, Math.ceil((todo.doneAt + RETENTION_MS - Date.now()) / 86400000));
          const expiry = document.createElement('span');
          expiry.className = 'expiry';
          expiry.textContent = `${daysLeft} gün kaldı`;
          li.append(expiry);
        }
        const edit = document.createElement('button');
        edit.className = 'edit';
        edit.textContent = '✎';
        edit.title = 'Düzenle';
        edit.setAttribute('aria-label', 'Görevi düzenle');
        edit.addEventListener('click', () => startEdit(todo.id));

        li.append(badge);
        if (todo.due) {
          const cal = document.createElement('button');
          cal.className = 'cal';
          cal.textContent = '📅';
          cal.title = 'Takvime ekle (telefon hatırlatması için)';
          cal.setAttribute('aria-label', 'Takvime ekle');
          cal.addEventListener('click', () => downloadIcs(todo));
          li.append(cal);
        }
        li.append(edit, del);
        (todo.done ? doneList : list).appendChild(li);
      }

      const doneCount = todos.filter(t => t.done).length;
      const remaining = todos.length - doneCount;
      empty.style.display = remaining ? 'none' : 'block';
      empty.textContent = todos.length ? 'Bekleyen görev yok.' : 'Henüz görev yok.';
      count.textContent = todos.length
        ? `${todos.length} görev · ${remaining} kalan`
        : '';
      folder.hidden = doneCount === 0;
      folderTitle.textContent = `Tamamlananlar (${doneCount})`;
    }

    function add(text, priority, due) {
      if (due) askNotifyPermission();
      const id = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      todos.push({ id, text, done: false, priority, due: due || null, notified: false });
      save();
      render();
    }

    function toggle(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        todo.doneAt = todo.done ? Date.now() : null;
      }
      save();
      render();
    }

    function formatDue(d) {
      return d.toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    // --- Hatırlatmalar ---
    // Not: Tarayıcı yalnızca sayfa açıkken (arka planda canlıysa) zamanında bildirim gösterebilir.
    // Sayfa kapalıyken güvenilir hatırlatma için 📅 ile görevi takvime ekleyin.
    function askNotifyPermission() {
      try {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      } catch {}
    }

    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      const span = document.createElement('span');
      span.textContent = '⏰ ' + msg;
      const close = document.createElement('button');
      close.textContent = '×';
      close.setAttribute('aria-label', 'Kapat');
      close.addEventListener('click', () => el.remove());
      el.append(span, close);
      toasts.appendChild(el);
      setTimeout(() => el.remove(), 30000);
    }

    async function notify(todo) {
      showToast(todo.text);
      try {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const opts = { body: 'Hatırlatma zamanı geldi', tag: String(todo.id) };
        const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
        if (reg) await reg.showNotification('⏰ ' + todo.text, opts);
        else new Notification('⏰ ' + todo.text, opts);
      } catch {}
    }

    function checkReminders() {
      const now = Date.now();
      let changed = false;
      for (const t of todos) {
        if (t.done || !t.due || t.notified) continue;
        if (new Date(t.due).getTime() <= now) {
          t.notified = true;
          changed = true;
          notify(t);
        }
      }
      if (changed) { save(); render(); }
    }

    function icsDate(d) {
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
    }

    function icsEscape(s) {
      return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    }

    function downloadIcs(todo) {
      const start = new Date(todo.due);
      const end = new Date(start.getTime() + 30 * 60000);
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gorev Listesi//TR',
        'BEGIN:VEVENT',
        `UID:${todo.id}@gorev-listesi`,
        `DTSTAMP:${stamp}`,
        `DTSTART:${icsDate(start)}`,
        `DTEND:${icsDate(end)}`,
        `SUMMARY:${icsEscape(todo.text)}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(todo.text)}`, 'TRIGGER:PT0S', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'
      ];
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gorev.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function startEdit(id) {
      editingId = id;
      render();
    }

    function buildEditRow(li, todo, checkbox) {
      checkbox.disabled = true;

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'edit-text';
      nameInput.value = todo.text;
      nameInput.setAttribute('aria-label', 'Görev adı');

      const sel = document.createElement('select');
      sel.setAttribute('aria-label', 'Önem derecesi');
      for (const [value, label] of Object.entries(LABELS)) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        sel.appendChild(opt);
      }
      sel.value = LABELS[todo.priority] ? todo.priority : 'orta';

      const dueEdit = document.createElement('input');
      dueEdit.type = 'datetime-local';
      dueEdit.value = todo.due || '';
      dueEdit.setAttribute('aria-label', 'Hatırlatma zamanı');

      const commit = () => {
        const name = nameInput.value.trim();
        if (name) todo.text = name;
        todo.priority = sel.value;
        const newDue = dueEdit.value || null;
        if (newDue !== (todo.due || null)) {
          todo.notified = false;
          if (newDue) askNotifyPermission();
        }
        todo.due = newDue;
        editingId = null;
        save();
        render();
      };
      const cancel = () => { editingId = null; render(); };

      nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') cancel();
      });

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save';
      saveBtn.textContent = '✓';
      saveBtn.title = 'Kaydet';
      saveBtn.setAttribute('aria-label', 'Değişiklikleri kaydet');
      saveBtn.addEventListener('click', commit);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'cancel';
      cancelBtn.textContent = '✕';
      cancelBtn.title = 'Vazgeç';
      cancelBtn.setAttribute('aria-label', 'Düzenlemeden vazgeç');
      cancelBtn.addEventListener('click', cancel);

      li.append(checkbox, nameInput, dueEdit, sel, saveBtn, cancelBtn);
      requestAnimationFrame(() => { nameInput.focus(); nameInput.select(); });
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, prioritySelect.value, dueInput.value);
      dueInput.value = '';
      input.value = '';
      input.focus();
    });

    render();

    try {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    } catch {}
    checkReminders();
    setInterval(checkReminders, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });
  </script>
</body>
</html>
